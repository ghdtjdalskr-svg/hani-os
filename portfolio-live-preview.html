<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HANI Portfolio · Live Preview</title><link rel="stylesheet" href="hani-portfolio-preview.css"><style>body{font-family:system-ui,sans-serif;background:#f4f7fc;margin:0;padding:24px}main{max-width:1120px;margin:auto}.preview-banner{padding:16px;background:#fff4ce;border-radius:12px;margin-bottom:20px;line-height:1.6}@media(max-width:640px){body{padding:10px}}</style></head><body><main><div class="preview-banner"><b>예시 데이터 · 실제 보유자산 아님</b><br>승인 전 UI 검토용입니다. 운영 계좌와 연결하지 않으며 저장하지 않습니다.<br><label>확인할 상황 <select id="scenario"><option value="partial">가격 미연결 종목 포함</option><option value="complete">가격 연결 완료 · 현금 미확인</option><option value="cash">가격과 명시적 현금 확인</option><option value="empty">보유기록 없음</option></select></label></div><section id="portfolioLivePreview"></section></main><script src="hani-market-data.js"></script><script src="hani-portfolio-analytics.js"></script><script>
const stamp=new Date().toISOString();
const sample={state:{accounts:[{id:'a',name:'예시 국내계좌'},{id:'b',name:'예시 해외계좌'}],instruments:[{id:'s',name:'삼성전자',ticker:'005930',market:'KR',className:'주식'},{id:'h',name:'SK하이닉스',ticker:'000660',market:'KR',className:'주식'},{id:'n',name:'NVIDIA',ticker:'NVDA',market:'US',className:'주식'}],investmentBrokerSnapshots:[{period:'2026-10',snapshotDate:'2026-10-03',mode:'positions',recordType:'positions',status:'confirmed',accounts:[{accountId:'a',enabled:true,holdings:[{id:'s',instrumentId:'s',name:'삼성전자',quantity:10},{id:'h',instrumentId:'h',name:'SK하이닉스',quantity:2},{id:'raw',name:'코드 미확인 투자종목',quantity:3,evaluationAmount:270000}]},{accountId:'b',enabled:true,holdings:[{id:'n',instrumentId:'n',name:'NVIDIA',quantity:5,buyPrice:100,buyCurrency:'USD'}]}]}]},stocks:[{symbol:'005930',market:'KOSPI',currency:'KRW'},{symbol:'000660',market:'KOSPI',currency:'KRW'},{symbol:'NVDA',market:'NASDAQ',currency:'USD'}],quotes:[{symbol:'005930',currency:'KRW',lastPrice:70000,timestamp:stamp},{symbol:'000660',currency:'KRW',lastPrice:200000,timestamp:stamp},{symbol:'NVDA',currency:'USD',lastPrice:150,timestamp:stamp}],cashObservations:[]};
window.HaniAssetMarket={analyticsSource(){const data=structuredClone(sample),scenario=document.getElementById('scenario').value;if(scenario!=='partial')data.state.investmentBrokerSnapshots[0].accounts[0].holdings.pop();if(scenario==='empty')data.state.investmentBrokerSnapshots=[];if(scenario==='cash')data.cashObservations=['a','b'].flatMap(account_id=>['KRW','USD'].map(currency=>({account_id,currency,amount:currency==='KRW'?100000:100,kind:'EXPLICIT_CASH',status:'CONFIRMED',source:'example-only',as_of:stamp})));return data;}};
document.getElementById('scenario').addEventListener('change',()=>window.dispatchEvent(new Event('hani:market-updated')));
</script><script src="hani-portfolio-preview.js"></script></body></html>
