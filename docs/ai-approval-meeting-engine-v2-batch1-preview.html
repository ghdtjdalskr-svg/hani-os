<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HANI OS · Meeting Engine v2 Batch 1 Preview</title>
<style>
:root{--ink:#20273d;--muted:#77809a;--line:#e6e3ef;--purple:#7356db;--purple-soft:#f2edff;--green:#12876f;--green-soft:#e7f8f2;--amber:#a96312;--amber-soft:#fff4df;--red:#ba445f;--red-soft:#fff0f3;--blue:#3975bd;--blue-soft:#edf5ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf7f2,#f4f1fb 60%,#edf6fa);color:var(--ink);font-family:SUIT,Pretendard,"Noto Sans KR",sans-serif}.shell{max-width:1180px;margin:auto;padding:28px 20px 60px}.eyebrow{font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--purple)}h1{font-size:30px;margin:8px 0}.lead{color:var(--muted);line-height:1.65;margin:0 0 22px}.case-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.case-tabs button{border:1px solid var(--line);border-radius:16px;background:#fff;padding:14px;text-align:left;color:var(--ink);cursor:pointer}.case-tabs button.active{border-color:var(--purple);box-shadow:0 8px 22px #7356db1c;background:var(--purple-soft)}.case-tabs b,.case-tabs span{display:block}.case-tabs span{font-size:12px;color:var(--muted);margin-top:4px}.panel{background:#fff;border:1px solid var(--line);border-radius:25px;box-shadow:0 20px 50px #4f476112;overflow:hidden}.case-head{display:flex;justify-content:space-between;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line)}.case-code{font-size:12px;font-weight:900;color:var(--purple);letter-spacing:.08em}.case-head h2{font-size:22px;margin:5px 0 4px}.sub{font-size:13px;color:var(--muted)}.chips{display:flex;gap:7px;align-items:flex-start;flex-wrap:wrap;justify-content:flex-end}.chip{font-size:11px;font-weight:900;padding:7px 10px;border-radius:999px;background:#f2f3f7}.chip.warn{color:var(--amber);background:var(--amber-soft)}.chip.ok{color:var(--green);background:var(--green-soft)}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:16px 24px;background:#fbfbfd}.step{font-size:11px;text-align:center;border-radius:999px;padding:8px;background:#eef0f5;color:#8a91a4}.step.done{background:var(--green-soft);color:var(--green)}.step.current{background:var(--purple-soft);color:var(--purple);font-weight:900}.content{padding:24px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,.8fr);gap:18px}.hani{border:1px solid #ded7f6;background:linear-gradient(135deg,#f7f3ff,#fff);border-radius:20px;padding:18px}.section-label{font-size:11px;font-weight:900;letter-spacing:.09em;color:var(--purple)}.speaker{display:flex;gap:12px;margin-top:14px;align-items:flex-start}.avatar{width:64px;height:64px;border-radius:18px;background:#eadfff url('../assets/profiles/hani-profile-hani.webp') center/cover no-repeat;border:3px solid white;box-shadow:0 4px 14px #4d396d25;flex:none}.bubble{position:relative;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 16px;line-height:1.55;min-height:64px}.bubble:before{content:"";position:absolute;left:-7px;top:19px;width:12px;height:12px;background:#fff;border-left:1px solid var(--line);border-bottom:1px solid var(--line);transform:rotate(45deg)}.bubble b{display:block;color:var(--purple);font-size:12px;margin-bottom:3px}.readiness{margin-top:14px;border-radius:16px;padding:14px 16px;background:var(--amber-soft);color:#74480e;font-size:13px;line-height:1.55}.readiness.ok{background:var(--green-soft);color:#086853}.questions{border:1px solid var(--line);border-radius:20px;padding:18px}.questions h3{font-size:16px;margin:5px 0 14px}.question{margin-top:12px}.question label{font-size:13px;font-weight:800;display:block;margin-bottom:7px}.question label span{font-size:10px;color:var(--red);background:var(--red-soft);padding:4px 7px;border-radius:999px;margin-right:6px}.question textarea{width:100%;min-height:62px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:800;border-radius:11px;padding:10px 14px;cursor:pointer}.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.btn:disabled{opacity:.38;cursor:not-allowed}.guard{grid-column:1/-1;border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;justify-content:space-between;gap:16px;align-items:center}.guard b{display:block}.guard .sub{margin-top:4px}.decision-actions{display:flex;gap:7px}.decision-actions .approve{background:var(--green);color:#fff;border-color:var(--green)}.note{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}@media(max-width:760px){.shell{padding:18px 12px 40px}h1{font-size:24px}.case-tabs{grid-template-columns:1fr 1fr}.case-tabs button{padding:11px}.case-head{display:block}.chips{justify-content:flex-start;margin-top:14px}.timeline{grid-template-columns:repeat(3,1fr);padding:13px}.content{grid-template-columns:1fr;padding:14px}.speaker{display:block}.avatar{margin-bottom:10px}.guard{display:block}.decision-actions{margin-top:14px;flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell">
  <div class="eyebrow">HANI OS · FRONT INTERACTION PREVIEW</div>
  <h1>Meeting Engine v2 · Decision Readiness</h1>
  <p class="lead">기존 AI 결재실 화면을 유지하면서, 결론을 내릴 준비가 되었을 때만 대표 승인 단계가 열리는 흐름입니다. 아래 네 가지 검증 사례를 전환해 확인할 수 있습니다.</p>
  <nav class="case-tabs" id="caseTabs"></nav>
  <section class="panel">
    <header class="case-head"><div><div class="case-code" id="caseCode"></div><h2 id="caseTitle"></h2><div class="sub" id="caseMeta"></div></div><div class="chips"><span class="chip" id="caseState"></span><span class="chip" id="caseSame">SAME CASE</span><span class="chip" id="caseReadiness"></span></div></header>
    <div class="timeline" id="timeline"></div>
    <div class="content">
      <article class="hani"><div class="section-label" id="summaryLabel">DECISION READINESS GATE</div><div class="speaker"><div class="avatar"></div><div class="bubble"><b>하니 · Chair</b><span id="haniMessage"></span></div></div><div class="readiness" id="readinessNote"></div></article>
      <aside class="questions"><div class="section-label">BLOCKING QUESTION</div><h3 id="questionTitle"></h3><div id="questionList"></div><div class="actions"><button class="btn primary" id="answerBtn">같은 Case에 답변 반영</button><button class="btn" id="resetBtn">상태 다시 보기</button></div></aside>
      <div class="guard"><div><b>성민 대표님 최종 결재</b><div class="sub" id="guardText"></div></div><div class="decision-actions"><button class="btn approve" id="approveBtn">✓ 승인</button><button class="btn">⏸ 보류</button><button class="btn">↺ 수정 요청</button></div></div>
    </div>
  </section>
  <div class="note">정적 검토 화면입니다. 데이터·Supabase·기존 Case를 쓰거나 변경하지 않습니다.</div>
</main>
<script>
const cases=[
 {id:"A",title:"오사카 여행 일정 짜줘",meta:"날짜·기간·예산이 아직 없는 DEEP Case",state:"ANALYZING",readiness:"NEED_USER_INFO",msg:"일정을 바로 확정하면 가정이 너무 많아져요. 결론을 바꿀 두 가지부터 확인할게요.",note:"BLOCKING 질문은 한 번에 최대 2개만 표시합니다. 답변 후 같은 Case에서 남은 질문의 우선순위를 다시 판정합니다.",questions:["출발일과 여행 기간은 어떻게 되나요?","1인 기준 총예산 상한은 얼마인가요?"],after:{readiness:"NEED_USER_INFO",msg:"답변을 같은 Case에 반영했어요. 이제 숙소 지역 한 가지만 확인하면 실제 동선안을 만들 수 있어요.",note:"기존 Review와 답변을 보존하고 관련 부분만 다시 검토합니다.",questions:["숙소 희망 지역은 어디인가요?"]}},
 {id:"B",title:"조건이 부족한 구매 검토",meta:"핵심 가격·사용 조건을 확인하지 못한 Case",state:"HELD",readiness:"HOLD",msg:"현재 정보만으로는 실행 가능한 결론을 만들 수 없어요. 임의의 조건을 채우지 않고 Case를 보존할게요.",note:"STATUS: HOLD · 필요한 정보가 들어오면 동일 Case에서 회의를 재개합니다.",questions:[]},
 {id:"C",title:"호텔은 난바 근처로 할게",meta:"기존 오사카 여행 Case에 대표 조건 추가",state:"ANALYZING",readiness:"NEED_USER_INFO",msg:"새 Case를 만들지 않고 기존 여행 Case에 난바 숙소 조건을 누적했어요. 동선과 비용 영향만 다시 볼게요.",note:"기존 Case ID, Review, 답변 Context를 유지합니다.",questions:["확정된 출발일을 알려주세요."],after:{readiness:"READY",msg:"필요한 조건이 모였고 Verification을 통과했어요. 이제 최종 일정안을 대표님께 올릴 수 있습니다.",note:"Decision Readiness PASS · 대표 승인 가능",questions:[]}},
 {id:"D",title:"카페 취향은 아직 없어",meta:"OPTIONAL 선호만 비어 있는 여행 Case",state:"AWAITING_APPROVAL",readiness:"READY",msg:"카페 취향은 일정의 핵심 조건이 아니어서 결론을 막지 않았어요. 현지 평점과 동선 기준으로 후보를 표시하겠습니다.",note:"OPTIONAL 정보는 미확인으로 표시하거나 합리적 기본값을 사용하며 Clarification을 반복하지 않습니다.",questions:[]}
];
let active=0,answered=false;
const $=id=>document.getElementById(id);
function render(){const c=cases[active],view=answered&&c.after?{...c,...c.after}:c,ready=view.readiness==="READY";$("caseTabs").innerHTML=cases.map((x,i)=>`<button class="${i===active?'active':''}" data-i="${i}"><b>CASE ${x.id}</b><span>${x.title}</span></button>`).join("");document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{active=+b.dataset.i;answered=false;render()});$("caseCode").textContent=`HANI-MEETING-V2-${c.id} · CASE ${c.id}`;$("caseTitle").textContent=c.title;$("caseMeta").textContent=c.meta;$("caseState").textContent=view.state||c.state;$("caseReadiness").textContent=view.readiness;$("caseReadiness").className=`chip ${ready?'ok':'warn'}`;$("timeline").innerHTML=["Case 접수","조건 분석","Readiness","관련 검토","하니 종합","대표 결재"].map((x,i)=>`<div class="step ${i<2?'done':i==2||ready&&i<5?'current':''}">${x}</div>`).join("");$("haniMessage").textContent=view.msg;$("readinessNote").textContent=view.note;$("readinessNote").className=`readiness ${ready?'ok':''}`;$("questionTitle").textContent=view.questions.length?`이번에 확인할 ${Math.min(2,view.questions.length)}개 질문`:(ready?"추가 질문 없음":"현재 질문 생성 대기");$("questionList").innerHTML=view.questions.slice(0,2).map((q,i)=>`<div class="question"><label><span>BLOCKING</span>${i+1}. ${q}</label><textarea placeholder="대표님 답변"></textarea></div>`).join("");$("answerBtn").style.display=view.questions.length?"inline-block":"none";$("approveBtn").disabled=!ready;$("guardText").textContent=ready?"Readiness와 Verification을 통과했습니다.":`${view.readiness} 상태이므로 승인 버튼이 잠겨 있습니다.`}
$("answerBtn").onclick=()=>{answered=true;render()};$("resetBtn").onclick=()=>{answered=false;render()};render();
</script>
</body>
</html>
