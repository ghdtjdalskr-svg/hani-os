<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="../">
  <title>HANI BOARDROOM · Live Meeting Preview</title>
  <link rel="stylesheet" href="hani-office-live.css">
  <style>
    *{box-sizing:border-box}body{margin:0;padding:20px;background:#f3f0f7;color:#241e34;font-family:system-ui,sans-serif}.view{max-width:1440px;margin:auto}.view.active{display:block}.preview-head{margin-bottom:16px}.preview-head h1{margin:0 0 4px;font-size:24px}.preview-head p{margin:0;color:#655d73}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.btn,.controls button{padding:9px 13px;border:1px solid #cec3e5;border-radius:10px;background:#fff;color:#493479;font-weight:700;cursor:pointer}.controls button:hover{background:#eee8fa}.fixture{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:#fff8de;color:#634c14;font-size:13px}@media(max-width:700px){body{padding:10px}.preview-head h1{font-size:20px}}
  </style>
</head>
<body>
  <main class="view active">
    <div class="preview-head"><h1>HANI BOARDROOM · Live Meeting Preview</h1><p>소집과 회의 진행 상태를 확인하는 프론트 시안</p></div>
    <p class="fixture">이 페이지는 화면 검증용 fixture입니다. 서버·DB에 연결되지 않습니다. 아래 예시 의견과 결론은 화면 배치 확인용 문구이며 실제 Agent 논의나 Decision이 아닙니다.</p>
    <div class="controls"><button type="button" data-stage="INTAKE">1 안건 접수</button><button type="button" data-stage="SUMMONING">2 배정 후 소집</button><button type="button" data-stage="MEETING_ROUND_1">3 검토 중</button><button type="button" data-stage="REVIEW_COMPLETE">4 저장된 의견 예시</button><button type="button" data-stage="CROSS_REVIEW">5 교차 검토 예시</button><button type="button" data-stage="NEED_USER_INFO">6 추가 질문 예시</button><button type="button" data-stage="RESEARCH">7 자료 조사</button><button type="button" data-stage="SYNTHESIZING">8 하니 종합 중</button><button type="button" data-stage="READY">9 결론 예시</button></div>
    <section class="hani-office-live" id="haniOfficeLive" aria-label="HANI GROUP 사무실">
      <div class="hani-office-live-head"><div><small>HANI GROUP · LIVING OFFICE</small><h3>하니네 사무실</h3><p>배정된 Agent가 회의실로 이동한 뒤 실제 진행 상태를 보여줍니다.</p></div><div class="hani-office-live-actions"><span id="haniOfficeCaseState">평상시 근무 중</span><button class="btn" id="haniOfficeMeetingOpen" type="button" disabled>회의실 보기</button><button class="btn" id="haniOfficeReturn" type="button" hidden>사무실로 돌아가기</button></div></div>
      <div class="hani-office-scroll"><div class="hani-office-map" id="haniOfficeMap" data-state="idle"><img class="hani-office-background" src="assets/ai-approval-concepts/v3-office-background-empty-8-seats.webp" alt="화이트 오피스"><img class="hani-office-ci" src="assets/brand/hani-group-ci-official.webp" alt="" aria-hidden="true"><img class="hani-office-foreground hani-office-foreground-leader" src="assets/ai-approval-concepts/v3-office-background-empty-8-seats.webp" alt="" aria-hidden="true"><img class="hani-office-foreground hani-office-foreground-row1" src="assets/ai-approval-concepts/v3-office-background-empty-8-seats.webp" alt="" aria-hidden="true"><img class="hani-office-foreground hani-office-foreground-row2" src="assets/ai-approval-concepts/v3-office-background-empty-8-seats.webp" alt="" aria-hidden="true"><div id="haniOfficeActors"></div></div></div>
      <div class="hani-office-meeting" id="haniOfficeMeeting" hidden><div class="hani-office-meeting-title"><div><small>SAMPLE MEETING · 화면 예시</small><h4 id="haniOfficeMeetingTitle">회의실</h4><p id="haniOfficeMeetingMeta"></p></div><button class="btn" id="haniOfficeReportLink" type="button">전체 검토서 보기 ↓</button></div><div class="hani-office-participants" id="haniOfficeParticipants" aria-live="polite" hidden></div><div class="hani-office-conversation" id="haniOfficeConversation"></div><div class="hani-office-questions" id="haniOfficeQuestions" hidden></div></div>
    </section>
    <div id="agentCaseDetail"></div>
  </main>
  <script src="hani-office-live.js"></script>
  <script>
    const sampleCase={id:"preview-only",case_code:"PREVIEW",title:"10월 여행 일정 검토",status:"ANALYZING"};
    const sampleReviews=[{agent_key:"JIEUN",review_round:1,verdict:"검토",summary:"예시 문구: 예산 상한과 예약 비용을 확인해야 합니다."},{agent_key:"SUYEON",review_round:1,verdict:"검토",summary:"예시 문구: 숙소 위치에 따라 이동 동선이 달라집니다."}];
    const sampleCross={review_round:1,turns:[{speaker:"JIEUN",stance:"QUALIFY",reply_to:"review:SUYEON",content:"예시 문구: 수연이 말한 동선 기준에 동의해. 다만 숙소 위치가 달라지면 교통비도 함께 비교해야 해."},{speaker:"SUYEON",stance:"AGREE",reply_to:"turn:1",content:"예시 문구: 맞아. 이동시간과 교통비를 같은 숙소 후보별로 놓고 봐야 일정이 실제로 쓸 만해져."}],hani_issue_summary:{agreement:"예시 문구: 숙소 후보별 이동시간과 교통비를 함께 비교",disagreement:"예시 문구: 현재는 없음",missing_condition:"예시 문구: 대표님의 숙소 지역 선호",next_decision:"예시 문구: 선호 지역을 확인한 뒤 일정 확정"}};
    document.querySelectorAll("[data-stage]").forEach(button=>button.addEventListener("click",()=>{
      const stage=button.dataset.stage,detail=document.getElementById("agentCaseDetail");
      detail.innerHTML=stage==="NEED_USER_INFO"?'<div class="agent-subsection agent-readiness-questions"><b>화면 배치 예시 · 실제 질문 아님</b><p>숙소 위치는 어느 지역을 선호하시나요?</p><textarea aria-label="예시 답변" placeholder="답변 화면 예시"></textarea><p>실제 Case에서는 이 자리에서 같은 Case에 답변을 반영합니다.</p><button type="button" disabled>미리보기에서는 제출할 수 없음</button></div>':"";
      const hasExample=["REVIEW_COMPLETE","CROSS_REVIEW","NEED_USER_INFO","RESEARCH","SYNTHESIZING","READY"].includes(stage),reviews=hasExample?sampleReviews:[];
      const c=stage==="READY"?{...sampleCase,hani_final:{executive_summary:"예시 문구: 예산과 동선의 확인 조건을 분리했습니다. 숙소 지역이 확정되면 일정을 결정할 수 있습니다."}}:sampleCase;
      window.haniOfficeLiveStage({stage,case:c,reviews,...(stage==="SUMMONING"?{selected_agents:[{agent_key:"JIEUN"},{agent_key:"SOOYEON"}]}:{}),...(stage==="CROSS_REVIEW"?{cross_review:sampleCross}:{})});
      window.haniOfficeLiveUpdate({case:c,reviews});
      document.getElementById("haniOfficeMeetingMeta").textContent="화면 예시 · 실제 Case/DB와 연결되지 않음";
    }));
  </script>
</body>
</html>
