name: HANI One-Pass Release
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: hani-one-pass-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  one-pass:
    name: Build + One-Pass Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout frozen candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Classify exact changed scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/hani-ci-scope.mjs --self-test
          node scripts/hani-ci-scope.mjs "$BASE_SHA" "$HEAD_SHA"
      - name: Documentation safety checks
        if: steps.scope.outputs.docs_only == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/hani-release-preqa.mjs --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Self-test release contract
        if: steps.scope.outputs.tooling == 'true'
        run: node scripts/hani-one-pass-release.mjs --self-test
      - name: Build frozen runtime package
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/hani-release-package.mjs build --candidate "${{ github.event.pull_request.head.sha }}" --base "${{ github.event.pull_request.base.sha }}" --output "$RUNNER_TEMP/hani-one-pass-package.json"
      - name: One-Pass Preflight
        if: steps.scope.outputs.docs_only != 'true'
        run: node scripts/hani-one-pass-release.mjs --package "$RUNNER_TEMP/hani-one-pass-package.json" --base "${{ github.event.pull_request.base.sha }}" > "$RUNNER_TEMP/hani-one-pass-evidence.json"
      - name: Publish immutable package and evidence
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hani-one-pass-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/hani-one-pass-package.json
            ${{ runner.temp }}/hani-one-pass-evidence.json
          retention-days: 30
          if-no-files-found: error
